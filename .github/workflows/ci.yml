# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: only the release job, on main, writes (tags, releases).
permissions:
  contents: read

# A new push to a PR cancels its stale run; every main commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: sh

jobs:
  lint:
    name: Lint
    # Lint with the brew tools bootstrap.sh installs; ubuntu runners ship
    # brew too.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # $/ = this repo at the running commit (self-repository syntax).
      - uses: $/.github/actions/setup-venv
      # Same list as LINT_TOOLS in scripts/bootstrap.sh. The runner image
      # ships jq and yq, not shellcheck.
      - name: Install lint tools
        env:
          LINT_TOOLS: jq yq shellcheck
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          for tool in $LINT_TOOLS; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done
      - name: Lint
        run: ./scripts/lintme.sh -c

  test:
    name: Test
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-venv
      - name: Test
        run: pytest

  version:
    name: Version
    # A PR that changes shipped files must bump VERSION and open
    # CHANGELOG.md with its section; ./scripts/release.sh -h has the rules.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR's merge commit and its parents; HEAD^1 is the base
          # branch tip it merges into.
          fetch-depth: 2
      - name: Check version
        run: ./scripts/release.sh check HEAD^1

  release:
    name: Release
    # Each new VERSION on main becomes tag vVERSION and a GitHub Release,
    # once lint and test pass. Re-run with `gh workflow run ci.yml`.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/release.sh publish
